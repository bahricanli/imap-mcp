services:
  mail-mcp:
    build: .
    image: ghcr.io/bahricanli/imap-mcp:latest
    restart: unless-stopped
    ports:
      - "8080:8080"           # önüne Traefik/nginx + TLS koy; OAuth için HTTPS şart
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/database.sqlite
      LOG_CHANNEL: stderr
    volumes:
      - storage:/var/www/html/storage   # SQLite + Passport anahtarları + loglar

volumes:
  storage:
