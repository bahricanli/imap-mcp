name: docker

# main push'u ve PR: sadece build + smoke test (yayın yok).
# v*.*.* tag'i (veya tag seçilerek elle çalıştırma): test geçerse GHCR + Docker Hub'a yayın.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: imap-mcp
  DOCKERHUB_NAMESPACE: bahricanli   # hub.docker.com/r/bahricanli/imap-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1) amd64 imajını yerelde build et ve gerçekten çalıştığını doğrula.
      - name: Build (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Smoke test (proxy arkası gibi)
        env:
          APP_PORT: '8090'   # varsayılan dışı bir port: .env'den port değiştirme de test edilir
        run: |
          set -o pipefail
          bash scripts/smoke-test.sh ${{ env.IMAGE_NAME }}:test 2>&1 | tee smoke.log

      - name: Report smoke failure
        if: failure()
        run: |
          # GitHub adım başına 10 annotation gösterir: logları tek, çok satırlı mesajda topla.
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          echo "::error title=container logs::$(docker logs mail-mcp-smoke 2>&1 | tail -80 | enc)"
          echo "::error title=smoke log::$(grep -v '^+ \(sleep\|for\|curl -fsS http://localhost:[0-9]*/up\)' smoke.log | tail -40 | enc)"

      # 2) Testler geçtiyse çok mimarili imajı GHCR'ye ve Docker Hub'a gönder.
      - name: Decide publishing
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Elle çalıştırmada (workflow_dispatch) "Use workflow from" alanında bir tag seçilmeli.
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "images<<EOF" >> "$GITHUB_OUTPUT"
            echo "ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "images=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN yok; Docker Hub adımı atlanıyor."
          fi

      - name: Metadata
        id: meta
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.publish.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Log in to GHCR
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true' && steps.publish.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

  # 3) İmajlar yayınlandıktan sonra tag için GitHub Release sayfası aç.
  #    Notlar CHANGELOG.md'deki "## [X.Y.Z]" bölümünden alınır. Release zaten varsa dokunulmaz.
  release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::$TAG için release zaten var; atlanıyor."
            exit 0
          fi
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[Unreleased\]:/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md içinde [$VERSION] bölümü yok."
            exit 1
          fi
          {
            echo
            echo "### Docker images"
            echo
            echo "- \`ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${VERSION}\`"
            echo "- \`${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:${VERSION}\`"
            echo
            echo "linux/amd64 and linux/arm64. Setup: [docs/docker-install.md](https://github.com/${{ github.repository }}/blob/${TAG}/docs/docker-install.md)"
          } >> notes.md
          gh release create "$TAG" --verify-tag --title "${{ env.IMAGE_NAME }} ${VERSION}" --notes-file notes.md
