name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1) amd64 imajını yerelde build et ve gerçekten çalıştığını doğrula.
      - name: Build (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: imap-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (proxy arkası gibi)
        env:
          APP_PORT: '9000'   # varsayılan dışı bir port: .env'den port değiştirme de test edilir
        run: |
          set -o pipefail
          bash scripts/smoke-test.sh imap-mcp:test 2>&1 | tee smoke.log

      - name: Report smoke failure
        if: failure()
        run: |
          [ -f smoke.log ] && tail -60 smoke.log | sed 's/^/::error::/' | head -60
          docker logs mail-mcp-smoke 2>&1 | tail -40 | sed 's/^/::error::[container] /' || true

      # 2) Testler geçtiyse çok mimarili imajı GHCR'ye gönder.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
