name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1) amd64 imajını yerelde build et ve gerçekten çalıştığını doğrula.
      - name: Build (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: imap-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (proxy arkası gibi)
        run: |
          docker run -d --name t -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e APP_URL=https://mail-mcp.example.com \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/var/www/html/storage/database.sqlite \
            -e LOG_CHANNEL=stderr \
            imap-mcp:test

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/up >/dev/null 2>&1 && break
            sleep 2
          done

          set -e
          echo "::group::container logs"; docker logs t; echo "::endgroup::"

          curl -fsS http://localhost:8080/up
          curl -fsS -o /dev/null -w "login %{http_code}\n" http://localhost:8080/login

          meta=$(curl -fsS -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Host: mail-mcp.example.com' \
            http://localhost:8080/.well-known/oauth-authorization-server)
          echo "$meta"
          echo "$meta" | grep -q '"authorization_endpoint":"https://mail-mcp.example.com/oauth/authorize"' \
            || { echo "::error::OAuth metadata https adresi üretmiyor"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://localhost:8080/mcp/mail)
          [ "$code" = 401 ] || { echo "::error::/mcp/mail token'sız 401 dönmeli, $code döndü"; exit 1; }

          docker exec t php artisan migrate:status | tail -3

      - name: Container logs on failure
        if: failure()
        run: docker logs t 2>&1 | tail -80 | sed 's/^/::error::/' | head -40 || true

      # 2) Testler geçtiyse çok mimarili imajı GHCR'ye gönder.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
