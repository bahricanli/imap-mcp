name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --no-interaction

      - name: Run tests
        run: php artisan test --log-junit junit.xml

      - name: Report failures as annotations
        if: failure()
        run: |
          php -r '
            if (! is_file("junit.xml")) { exit; }
            $x = simplexml_load_file("junit.xml");
            foreach ($x->xpath("//testcase[failure or error]") as $t) {
              $n = $t->failure ?: $t->error;
              $msg = substr(preg_replace("/\s+/", " ", (string) $n), 0, 900);
              echo "::error file=".$t["file"].",line=".$t["line"]."::".$t["class"]."::".$t["name"]." — ".$msg.PHP_EOL;
            }'
